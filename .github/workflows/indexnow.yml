name: Ping IndexNow

# WHY THIS EXISTS
# ───────────────
# Submitting the site to search engines is normally a waiting game: you publish,
# then hope a crawler comes back. IndexNow inverts that — it tells participating
# engines "this URL changed, come re-crawl it now" the moment a change ships.
#
# This matters specifically for AI answer engines. ChatGPT's search retrieval
# leans heavily on Bing's index, and Bing is an IndexNow participant (so are
# Yandex, Seznam and Naver). A page Bing hasn't indexed is a page ChatGPT
# effectively cannot cite. Pinging on every content push is the fastest
# supported way to close that gap.
#
# Auth is the key file at the site root (f14ae760d18bad17bc1d40b88caa3ebd.txt).
# The engine fetches it and checks the contents match the submitted key — so the
# key file MUST stay published and MUST contain exactly the key, nothing else.

on:
  push:
    branches: [ main ]
    paths:
      - 'index.html'
      - 'fr/**'
      - 'llms.txt'
      - 'sitemap.xml'
      - 'js/**'
      - 'css/**'
  # Allows a manual re-submit from the Actions tab without pushing anything.
  workflow_dispatch:

# Never let two submissions race; a stale ping is worse than a skipped one.
concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Submit changed URLs to IndexNow
        run: |
          set -euo pipefail

          KEY="f14ae760d18bad17bc1d40b88caa3ebd"
          HOST="aiwithrobert.com"

          # Confirm the key file is actually reachable first. If it 404s the
          # submission is rejected anyway, and a loud failure here is far easier
          # to diagnose than silent non-indexing weeks later.
          echo "Verifying key file is published..."
          PUBLISHED=$(curl -fsS --retry 3 --retry-delay 5 \
            "https://${HOST}/${KEY}.txt" || echo "FETCH_FAILED")

          if [ "$PUBLISHED" != "$KEY" ]; then
            echo "::error::Key file check failed at https://${HOST}/${KEY}.txt"
            echo "::error::expected '${KEY}', got '${PUBLISHED}'"
            exit 1
          fi
          echo "Key file OK."

          # Built with printf rather than a heredoc on purpose: this step is
          # indented inside YAML, and an indented heredoc terminator does not
          # close the heredoc (<<- strips tabs only, never spaces).
          BODY=$(printf '{"host":"%s","key":"%s","keyLocation":"https://%s/%s.txt","urlList":["https://%s/","https://%s/fr/","https://%s/llms.txt"]}' \
            "$HOST" "$KEY" "$HOST" "$KEY" "$HOST" "$HOST" "$HOST")

          echo "Submitting to IndexNow..."
          CODE=$(curl -sS -o /tmp/indexnow.out -w '%{http_code}' \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data "$BODY")

          echo "HTTP $CODE"
          cat /tmp/indexnow.out || true

          # 200 = accepted, 202 = accepted but key still being validated.
          case "$CODE" in
            200|202) echo "IndexNow submission accepted." ;;
            *) echo "::error::IndexNow rejected the submission (HTTP $CODE)"; exit 1 ;;
          esac
